[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim = { path = "../sim" }

# The shader compiler wgpu uses, so `cargo test` catches shader errors that
# would otherwise only show up in the browser. Keep its version in step with
# wgpu's.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

# Browser-only, so the rest of the crate builds and tests natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Window",
]
